name: espn-field-diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python espn_field_diagnostic.py
      - uses: actions/upload-artifact@v4
        with:
          name: espn-field-report
          path: espn-field-report.json
