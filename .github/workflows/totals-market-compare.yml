name: totals-market-compare
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out published history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: history
          persist-credentials: false
      - name: Check out exact experimental commit
        uses: actions/checkout@v4
        with:
          ref: a45a7027fb397c58bd9747ac08c0877c4afdff96
          path: experimental
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Run offline tests
        working-directory: experimental
        run: python -m unittest discover -s tests -v 2>&1 | tee ../market-tests.log
      - name: Compare model and market lines with final scores
        working-directory: history
        env:
          PYTHONPATH: ../experimental
        run: python ../experimental/totals_market_compare.py 2>&1 | tee ../market-compare.log
      - name: Upload results and logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: totals-market-compare
          path: |
            history/data/totals-market-compare.json
            market-tests.log
            market-compare.log
          if-no-files-found: warn
