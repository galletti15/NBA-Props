name: totals-backtest
on: workflow_dispatch
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact experimental commit
        uses: actions/checkout@v4
        with:
          ref: f55c245f7f1ff1d4515207cb892431266b4d72c7
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Run offline tests
        run: python -m unittest discover -s tests -v 2>&1 | tee shadow-tests.log
      - name: Run backtest on completed games
        run: python totals_backtest.py 2>&1 | tee backtest.log
      - name: Upload backtest results and logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: totals-backtest
          path: |
            data/totals-backtest.json
            shadow-tests.log
            backtest.log
          if-no-files-found: warn
