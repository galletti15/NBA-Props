name: Totals refresh
on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: totals-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python totals_pipeline.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Publish totals data
        run: |
          git config user.name bot
          git config user.email bot@x
          git add docs/totals.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh game and team totals"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
