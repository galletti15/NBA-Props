<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NBA & NFL Props</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#0f1115;color:#e8e8e8}header{position:sticky;top:0;background:#171a21;padding:10px;z-index:2}input,select,button{padding:10px;margin:4px 0;border-radius:8px;border:0;background:#262b36;color:#fff;font-size:16px}input,select{width:100%}button{min-width:85px;margin-right:8px}button[aria-selected=true]{background:#245aa0}.tab{display:inline-block;min-width:85px;padding:10px;margin:4px 8px 4px 0;border-radius:8px;background:#262b36;color:#fff;font-size:16px;text-align:center;text-decoration:none}.c{margin:8px;padding:12px;border-radius:12px;background:#1b1f28}.r{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.o{color:#4ade80}.u{color:#f87171}small{color:#aab4bf}#notice{padding:8px;color:#ded7b0}</style></head><body>
<header><nav aria-label="Sport and totals"><button id="nba" aria-selected="true">NBA</button><button id="nfl" aria-selected="false">NFL</button><a class="tab" href="totals.html">Totals</a></nav><b id="title">NBA Prop Projections</b><br><small id="up"></small><input id="q" aria-label="Search player or team" placeholder="Search player/team"><select id="m" aria-label="Stat"></select><select id="e" aria-label="Minimum edge"><option value="0">All edges</option><option value=".04">Edge ≥ 4%</option><option value=".08">Edge ≥ 8%</option></select></header><div id="notice" role="status"></div><div id="l"></div><script>
const $=id=>document.getElementById(id), stats={nba:['PTS','REB','AST','FG3M','STL','BLK'],nfl:['PASS YDS','PASS ATT','PASS CMP','PASS TD','INT','RUSH YDS','RUSH ATT','REC YDS','REC']};let sport='nba',D=[],generation=0;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pct=x=>Number.isFinite(x)?(x*100).toFixed(0)+'%':'—';
function choose(s){sport=s;for(const k of ['nba','nfl'])$(k).setAttribute('aria-selected',String(k===s));$('title').textContent=s.toUpperCase()+' Prop Projections';$('m').innerHTML='<option value="">All stats</option>'+stats[s].map(x=>'<option>'+x+'</option>').join('');load()}
async function load(){const token=++generation,selected=sport;D=[];$('l').textContent='Loading…';$('notice').textContent='';$('up').textContent='';try{const r=await fetch((selected==='nba'?'data.json':'nfl.json')+'?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(token!==generation)return;if(!Array.isArray(j.props))throw Error('Invalid data');D=j.props;$('up').textContent=j.updated?'Updated '+new Date(j.updated).toLocaleString(): 'No successful refresh yet';$('notice').textContent=j.message||'';if(j.updated&&Date.now()-Date.parse(j.updated)>2*3600000)$('notice').textContent+=' Data is over two hours old; check refresh status.';draw()}catch(err){if(token!==generation)return;$('l').textContent='Data unavailable. The refresh may not have completed successfully. Try again later.';$('notice').textContent=selected==='nfl'?'NFL needs a successful NFL refresh before cards can appear.':''}}
function draw(){const s=$('q').value.toLowerCase(),mm=$('m').value,ed=+$('e').value;const rows=D.filter(r=>(!s||[r.player,r.team,r.opp].join(' ').toLowerCase().includes(s))&&(!mm||r.market===mm)&&Math.abs(r.edge)>=ed);$('l').innerHTML=rows.map(r=>`<div class="c"><div class="r"><b>${esc(r.player)}</b><span class="${r.pick==='OVER'?'o':'u'}">${esc(r.pick)} ${esc(r.line)} ${esc(r.market)}</span></div><div class="r"><small>${esc(r.team)} · ${esc(r.opp)}</small><span>Proj <b>${esc(r.proj)}</b></span></div><small>${esc(r.status)}</small><div class="r"><small>Model ${pct(r.p_over)} over · Mkt ${pct(r.mkt_p_over)}</small><span>Edge ${(r.edge*100).toFixed(1)}%</span></div>${sport==='nba'?`<small>Play ${pct(r.play_prob)} · Usage +${pct(r.usage_boost)} · Spread ${esc(r.spread)}</small>`:`<small>Historical sample: ${esc(r.sample)} games · ${esc(new Date(r.start).toLocaleString())}</small>`}<br><small>O ${esc(r.best_over)} | U ${esc(r.best_under)}${sport==='nfl'?' (decimal odds)':''}</small></div>`).join('')||'<div class="c">No props available for this selection. NFL covers only games starting in the next 48 hours; markets may not be posted yet.</div>'}
for(const k of ['nba','nfl'])$(k).onclick=()=>choose(k);for(const k of ['q','m','e'])$(k).oninput=draw;choose('nba');setInterval(load,300000);
</script></body></html>
