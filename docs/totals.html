<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game & Team Totals</title><style>*{box-sizing:border-box}body{margin:0;background:#0f1115;color:#eee;font:16px system-ui}header{position:sticky;top:0;background:#171a21;padding:12px}a{color:#9dc8ff}select,input{width:100%;padding:12px;margin:5px 0;background:#262b36;color:white;border:0;border-radius:8px;font:inherit}.card{background:#1b1f28;margin:10px;padding:14px;border-radius:12px}small{color:#aab4bf}#notice{padding:12px}table{width:100%;font-size:14px;text-align:left}td{padding:5px 2px}p{line-height:1.45}</style></head><body><header><a href="index.html">Back to NBA / NFL player props</a><h3>Game & Team Totals</h3><select id="league" aria-label="League"><option>NBA</option><option>NFL</option><option>NCAAF</option><option>NCAAB</option></select><select id="view" aria-label="Market"><option value="game">Game totals</option><option value="team">Team totals</option></select><input id="search" placeholder="Search team" aria-label="Search team"><small id="updated"></small></header><div id="notice" role="status"></div><div id="cards"></div><script>
const $=id=>document.getElementById(id);let data=null;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lines(q,p){if(!q.length)return '<p>No sportsbook line available.</p>';return '<table><tr><th>Book / line</th><th>O / U</th><th>Difference</th></tr>'+q.map(x=>{const d=p==null?null:p-x.line;return `<tr><td>${esc(x.book)} ${esc(x.line)}<br><small>${esc(x.updated?new Date(x.updated).toLocaleString():'Time unavailable')}</small></td><td>${esc(x.over)} / ${esc(x.under)}</td><td>${d==null?'—':(d>0?'+':'')+d.toFixed(1)+' pts'}</td></tr>`}).join('')+'</table>'}
function draw(){if(!data)return;const l=data.leagues.find(x=>x.league===$('league').value);if(!l){$('cards').textContent='Waiting for first totals refresh.';return}const s=$('search').value.toLowerCase();$('notice').textContent=data.note+' '+(l.errors||[]).join('; ');$('cards').innerHTML=`<div class="card"><small>Showing up to 8 of ${esc(l.available_games??'unknown')} upcoming games. NCAAB = men’s basketball. Difference = projection minus that book’s line, not a validated betting edge.</small></div>`+l.games.filter(g=>(g.home+' '+g.away).toLowerCase().includes(s)).map(g=>{const p=g.projection;return `<div class="card"><h3>${esc(g.away)} at ${esc(g.home)}</h3><small>${esc(new Date(g.start).toLocaleString())}</small><p>${esc(g.model_status)}${g.sample?' · Sample: '+esc(g.sample.home)+' home-team games / '+esc(g.sample.away)+' away-team games':''}</p>${$('view').value==='game'?`<p>Projected game total: ${p?esc(p.total):'Unavailable'}</p>${lines(g.game_quotes,p?.total)}`:`<h4>${esc(g.home)}</h4><p>Projected points: ${p?esc(p.home):'Unavailable'}</p>${lines(g.home_quotes,p?.home)}<h4>${esc(g.away)}</h4><p>Projected points: ${p?esc(p.away):'Unavailable'}</p>${lines(g.away_quotes,p?.away)}<small>${esc(g.team_odds_status)}</small>`}</div>`}).join('');if(!l.games.length)$('cards').innerHTML+='<div class="card">No games loaded. Check the message above for feed errors, or wait for upcoming markets.</div>'}
async function load(){try{const r=await fetch('totals.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();data=await r.json();if(!Array.isArray(data.leagues))throw Error();$('updated').textContent=data.updated?'Refresh attempted '+new Date(data.updated).toLocaleString():'No refresh yet';if(data.updated&&Date.now()-Date.parse(data.updated)>7*3600000)$('updated').textContent+=' — STALE';draw()}catch(e){$('notice').textContent='Totals data unavailable. The first Totals refresh may not have run yet.';$('cards').textContent=''}}for(const id of ['league','view','search'])$(id).oninput=draw;load();setInterval(load,300000);
</script></body></html>
